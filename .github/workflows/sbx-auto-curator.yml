name: sbx Auto Curator

on:
  # Run every day at 9am UTC
  schedule:
    - cron: "0 9 * * *"

  # Allow manual trigger with custom prompt
  workflow_dispatch:
    inputs:
      prompt:
        description: "Curator prompt to run"
        required: false
        default: "Scan GitHub and the web for new Docker Sandboxes (sbx) repositories, latest blog posts, YouTube videos, and related resources from the last week. For each find, open a tracking issue, then add all entries to the unreviewed section via a single auto-merged PR so folks can see the agent is managing the repo"
        type: string
      task:
        description: "Curator task"
        required: false
        default: "discover"
        type: choice
        options:
          - discover
          - validate-links
          - discover-kits
          - discover-templates

jobs:
  curate:
    name: Run sbx Curator Agent
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create agent-bot label (if missing)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh label create "agent-bot" \
            --description "Commits and PRs raised automatically by the sbx curator agent" \
            --color "0075ca" \
            --repo "${{ github.repository }}" \
          || echo "Label already exists, skipping."

      - name: Install Docker Agent
        run: |
          # Download the latest Docker Agent Linux binary
          curl -L -o /tmp/docker-agent https://github.com/docker/docker-agent/releases/latest/download/docker-agent-linux-amd64

          # Install as a Docker CLI plugin
          mkdir -p ~/.docker/cli-plugins
          mv /tmp/docker-agent ~/.docker/cli-plugins/docker-agent

          # Make it executable
          chmod +x ~/.docker/cli-plugins/docker-agent
          docker agent --help

      - name: Configure git for agent commits
        run: |
          git config user.name "sbx-curator-bot"
          git config user.email "sbx-curator-bot@users.noreply.github.com"

      - name: Set curator prompt
        id: prompt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROMPT="${{ github.event.inputs.prompt }}"
          else
            # Default scheduled prompt — scans GitHub + the web, opens a
            # tracking issue per find, and lands all entries in the
            # unreviewed section via a single auto-merged PR so contributors
            # can see the agent is managing the repo.
            PROMPT="Scan GitHub and the web for new Docker Sandboxes (sbx) repositories, latest blog posts, YouTube videos, and resources published in the last 7 days. For each genuine new entry: (1) open a tracking issue labelled agent-bot, and (2) append it to the 'Recently discovered (auto-added, unreviewed)' section of README.md with a one-line description and a security/maturity flag. Put all the additions on a branch and open a single PR (labelled agent-bot) whose body closes every tracking issue, then merge it with 'chore(curator):' so folks can see the agent is managing the repo. Never push directly to main."
          fi
          echo "prompt=${PROMPT}" >> $GITHUB_OUTPUT

      - name: Run sbx Curator Agent
        env:
          # The active `llama` model talks to NVIDIA's OpenAI-compatible
          # endpoint, so OPENAI_API_KEY carries the NVIDIA key. To use the
          # paid `gpt` (api.openai.com) model instead, point this at
          # secrets.OPENAI_API_KEY (a real platform.openai.com key).
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          docker agent run --yolo ./workflow/auto-curator-agent/sbx-curator.yaml \
            "${{ steps.prompt.outputs.prompt }}"

      - name: Summary
        if: always()
        run: |
          echo "## sbx Curator Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Prompt**: ${{ steps.prompt.outputs.prompt }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: tracking issue per find + single auto-merged PR (label: agent-bot)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each discovery opens an [agent-bot issue](https://github.com/${{ github.repository }}/issues?q=label%3Aagent-bot);" >> $GITHUB_STEP_SUMMARY
          echo "the entries land in the **Recently discovered (auto-added, unreviewed)** section of the" >> $GITHUB_STEP_SUMMARY
          echo "README via a single [agent-bot PR](https://github.com/${{ github.repository }}/pulls?q=label%3Aagent-bot)" >> $GITHUB_STEP_SUMMARY
          echo "that is merged automatically. Promote entries into the curated sections after a human review." >> $GITHUB_STEP_SUMMARY
